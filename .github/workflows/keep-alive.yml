name: Keep demos awake

on:
  schedule:
    - cron: "*/10 * * * *"   # Render free tier sleeps after ~15 min idle
    - cron: "0 */6 * * *"    # Streamlit Community Cloud: browser visit every 6 h
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/keep_alive.py --mode http

  streamlit:
    # every 6 h and on manual runs; not on the 10-minute schedule
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python scripts/keep_alive.py --mode browser
